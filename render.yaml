# Render Blueprint: one web service that serves both the Socket.IO server and the built React app.
services:
  - type: web
    name: scribble-clone
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
